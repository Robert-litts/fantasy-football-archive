services:
  api:
    image: ${API_IMAGE:-ghcr.io/robert-litts/fantasy-football-archive:latest}
    build:
      context: .
      dockerfile: Dockerfile
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "4000:4000"
    env_file:
      - ".env"
    environment:
      ESPN_DATABASE_URL: ${DOCKER_ESPN_DATABASE_URL:-postgres://sleeper:sleeper@host.docker.internal:5434/fantasy_espn_clone?sslmode=disable}
      SLEEPER_DATABASE_URL: ${DOCKER_SLEEPER_DATABASE_URL:-postgres://sleeper:sleeper@host.docker.internal:5434/sleeper_archive?sslmode=disable}
      OWNER_IDENTITIES_FILE: ${DOCKER_OWNER_IDENTITIES_FILE:-/config/owner-identities.json}
    volumes:
      - ./templates:/templates
      - ./internal/mailer/templates:/internal/mailer/templates
      - ./config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis-stack
    networks:
      - caddy_network

  redis-stack:
    image: redis/redis-stack@sha256:b6567ad2e9c0658bbf6c40657ee0576df4b82cb674763f8ae6d0c52046ef87f1
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8010:8001"
    networks:
      - caddy_network

