version: "2"
sql:
  - schema: "db/schema"
    queries: "db/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_pointers_for_null_types: true
  - schema: "db/sleeper_schema"
    queries: "db/sleeper_queries/"
    engine: "postgresql"
    gen:
      go:
        package: "sleeperdb"
        out: "internal/sleeperdb"
        emit_json_tags: true
        emit_pointers_for_null_types: true
